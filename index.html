<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor 4K Neon - Retro 90</title>

  <!-- Cargamos la librería HLS.js para reproducir M3U8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d11;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Contenedor en proporción 16:9 que previene deformaciones */
    .player-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 229, 255, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Área de reproducción */
    .screen-area {
      flex: 1;
      width: 100%;
      height: calc(100% - 60px);
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Barra de controles inferior */
    .controls-bar {
      height: 60px;
      background: rgba(15, 15, 22, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Badge 4K Neón a la izquierda */
    .badge-4k {
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      color: #00e5ff;
      text-shadow: 0 0 8px #00e5ff, 0 0 18px rgba(0, 229, 255, 0.6);
      padding: 4px 10px;
      border: 1.5px solid #00e5ff;
      border-radius: 6px;
      box-shadow: inset 0 0 6px rgba(0, 229, 255, 0.4), 0 0 10px rgba(0, 229, 255, 0.3);
      user-select: none;
    }

    /* Control de Volumen Neón abajo */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 40%;
      max-width: 300px;
    }

    .volume-icon {
      color: #00e5ff;
      font-size: 0.9rem;
      text-shadow: 0 0 5px #00e5ff;
      font-weight: bold;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1a1a24;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
    }

    .volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
      border: none;
    }

    /* Pantalla completa responsiva */
    .player-container:fullscreen {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <div class="player-container" id="player">
    
    <!-- Área de Vídeo -->
    <div class="screen-area">
      <video id="video" controls autoplay muted></video>
    </div>

    <!-- Barra Inferior -->
    <div class="controls-bar">
      <!-- Rótulo 4K Lado Izquierdo -->
      <div class="badge-4k">4K</div>

      <!-- Barra de Volumen Neón -->
      <div class="volume-container">
        <span class="volume-icon">VOL</span>
        <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
      </div>
    </div>

  </div>

  <script>
    const video = document.getElementById('video');
    const volumeControl = document.getElementById('volumeControl');

    // URL M3U8 cargada directamente
    const videoSrc = 'https://6641e38ac34c3.streamlock.net:1936/radioporcuna/radioporcuna/playlist.m3u8';

    // Carga de la emisión
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
    } 
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
    }

    // Control de volumen neón
    volumeControl.addEventListener('input', (e) => {
      video.volume = e.target.value;
    });
  </script>
