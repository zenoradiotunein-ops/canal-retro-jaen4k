<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor 4K Neon - Retro 90</title>

  <!-- Cargamos la librería HLS.js para reproducir M3U8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* Eliminación absoluta de márgenes del navegador */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background-color: #000000 !important;
      overflow: hidden !important;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* El contenedor se pega a las 4 esquinas de la ventana */
    .player-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Área de pantalla del reproductor */
    .screen-area {
      flex: 1;
      width: 100%;
      height: calc(100% - 60px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: 0;
      outline: 0;
    }

    /* Barra inferior de controles */
    .controls-bar {
      height: 60px;
      width: 100%;
      background: rgba(15, 15, 22, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      box-sizing: border-box;
    }

    /* Badge 4K Neón */
    .badge-4k {
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      color: #00e5ff;
      text-shadow: 0 0 8px #00e5ff, 0 0 18px rgba(0, 229, 255, 0.6);
      padding: 4px 10px;
      border: 1.5px solid #00e5ff;
      border-radius: 6px;
      box-shadow: inset 0 0 6px rgba(0, 229, 255, 0.4), 0 0 10px rgba(0, 229, 255, 0.3);
      user-select: none;
    }

    /* Barra de volumen neón */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 50%;
      max-width: 300px;
    }

    .volume-icon {
      color: #00e5ff;
      font-size: 0.9rem;
      text-shadow: 0 0 5px #00e5ff;
      font-weight: bold;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1a1a24;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
    }

    .volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
      border: none;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="screen-area">
      <video id="video" controls autoplay playsinline></video>
    </div>

    <div class="controls-bar">
      <div class="badge-4k">4K</div>
      <div class="volume-container">
        <span class="volume-icon">VOL</span>
        <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const volumeControl = document.getElementById('volumeControl');

    const videoSrc = 'https://6641e38ac34c3.streamlock.net:1936/radioporcuna/radioporcuna/playlist.m3u8';

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
    } 
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
    }

    volumeControl.addEventListener('input', (e) => {
      video.volume = e.target.value;
    });
  </script>

</body>
</html>
